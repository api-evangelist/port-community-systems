  name: IPCSA Port Community Systems API
  description: >-
    The International Port Community Systems Association (IPCSA) represents Port Community System operators
    and Maritime Single Window operators worldwide. Member PCS platforms provide APIs for customs declarations,
    cargo manifests, vessel call data, and port logistics coordination using REST and EDIFACT protocols.
