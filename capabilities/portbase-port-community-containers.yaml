naftiko: 1.0.0-alpha2
info:
  label: Portbase Port Community System API — Containers
  description: 'Portbase Port Community System API — Containers. 1 operations. Lead operation: Get container status. Self-contained
    Naftiko capability covering one Port Community Systems business surface.'
  tags:
  - Port Community Systems
  - Containers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PORT_COMMUNITY_SYSTEMS_API_KEY: PORT_COMMUNITY_SYSTEMS_API_KEY
capability:
  consumes:
  - type: http
    namespace: portbase-port-community-containers
    baseUri: https://api.portbase.com/v1
    description: Portbase Port Community System API — Containers business capability. Self-contained, no shared references.
    resources:
    - name: containers-containerId
      path: /containers/{containerId}
      operations:
      - name: getcontainer
        method: GET
        description: Get container status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: containerId
          in: path
          type: string
          description: Container number (ISO 6346 format, e.g. MSCU1234567)
          required: true
    authentication:
      type: bearer
      token: '{{env.PORT_COMMUNITY_SYSTEMS_API_KEY}}'
  exposes:
  - type: rest
    namespace: portbase-port-community-containers-rest
    port: 8080
    description: REST adapter for Portbase Port Community System API — Containers. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/containers/{containerid}
      name: containers-containerid
      description: REST surface for containers-containerId.
      operations:
      - method: GET
        name: getcontainer
        description: Get container status
        call: portbase-port-community-containers.getcontainer
        with:
          containerId: rest.containerId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: portbase-port-community-containers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Portbase Port Community System API — Containers. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: get-container-status
      description: Get container status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: portbase-port-community-containers.getcontainer
      with:
        containerId: tools.containerId
      outputParameters:
      - type: object
        mapping: $.
